<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameQuest AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
      padding: 50px 0;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
    }

    .subtitle {
      color: #aab2c8;
      font-size: 18px;
      margin-top: 10px;
    }

    .card {
      background: #151c32;
      border: 1px solid #293451;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #394766;
      background: #0f1527;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .quest {
      display: none;
    }

    .quest h2 {
      margin-top: 0;
    }

    .difficulty {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #252e4a;
      margin-bottom: 15px;
    }

    .quest-section {
      margin-top: 20px;
    }

    .quest-section h3 {
      margin-bottom: 7px;
    }

    .copy {
      margin-top: 25px;
      background: #24304d;
    }

    .footer {
      text-align: center;
      color: #737d98;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="hero">
      <div class="logo">🎮 GameQuest AI</div>
      <div class="subtitle">
        Turn your next gaming session into a challenge.
      </div>
    </div>

    <div class="card">

      <label for="game">Choose your game</label>

      <select id="game">
        <option>Minecraft</option>

        
        
      </select>

      <label for="difficulty">Difficulty</label>

      <select id="difficulty">
        <option>Easy</option>
        <option>Normal</option>
        <option>Hard</option>
        <option>INSANE</option>
      </select>

      <label for="type">Challenge type</label>

      <select id="type">
        <option>Survival</option>
        <option>Building</option>
        <option>Exploration</option>
        <option>Speedrun</option>
        <option>Random</option>
      </select>

      <button onclick="generateQuest()">
        🎲 GENERATE QUEST
      </button>

    </div>

    <div class="card quest" id="questCard">

      <div class="difficulty" id="questDifficulty"></div>

      <h2 id="questTitle"></h2>

      <div class="quest-section">
        <h3>🎯 Objective</h3>
        <p id="questObjective"></p>
      </div>

      <div class="quest-section">
        <h3>📜 Rules</h3>
        <p id="questRules"></p>
      </div>

      <div class="quest-section">
        <h3>⏱️ Time Limit</h3>
        <p id="questTime"></p>
      </div>

      <div class="quest-section">
        <h3>🔥 Bonus Challenge</h3>
        <p id="questBonus"></p>
      </div>

      <button class="copy" onclick="copyQuest()">
        📋 COPY CHALLENGE
      </button>

    </div>

    <div class="footer">
      GameQuest AI • Challenge yourself. Beat the quest.
    </div>

  </div>

<script>

const quests = [

  {
    title: "THE LOST EXPLORER",
    objective: "Travel away from your starting area and discover a new interesting location.",
    rules: "You cannot use a map. You must return safely before the time runs out.",
    time: "20 minutes",
    bonus: "Find something unusual and bring it back."
  },

  {
    title: "ONE LIFE BUILD",
    objective: "Build a small but useful base using only resources you collect during the challenge.",
    rules: "You cannot use materials from an existing chest or base.",
    time: "15 minutes",
    bonus: "Add a hidden room."
  },

  {
    title: "THE SURVIVOR",
    objective: "Collect food, basic tools and shelter without returning to your starting point.",
    rules: "You may only use resources you personally collect.",
    time: "20 minutes",
    bonus: "Collect three different types of food."
  },

  {
    title: "RANDOM DESTINY",
    objective: "Travel in a direction you have never explored before and complete a useful task.",
    rules: "Choose your direction before starting and don't change it.",
    time: "25 minutes",
    bonus: "Return with a rare item."
  },

  {
    title: "THE BUILDER",
    objective: "Build a creative structure using a limited selection of materials.",
    rules: "Choose only three main building materials.",
    time: "20 minutes",
    bonus: "Add a secret entrance."
  }

];

function generateQuest() {

  const game = document.getElementById("game").value;
  const difficulty = document.getElementById("difficulty").value;
  const type = document.getElementById("type").value;

  const quest =
    quests[Math.floor(Math.random() * quests.length)];

  document.getElementById("questDifficulty").textContent =
    "🔥 " + difficulty;

  document.getElementById("questTitle").textContent =
    quest.title;

  document.getElementById("questObjective").textContent =
    quest.objective;

  document.getElementById("questRules").textContent =
    quest.rules;

  document.getElementById("questTime").textContent =
    quest.time;

  document.getElementById("questBonus").textContent =
    quest.bonus;

  document.getElementById("questCard").style.display =
    "block";

}

function copyQuest() {

  const title =
    document.getElementById("questTitle").textContent;

  const objective =
    document.getElementById("questObjective").textContent;

  const rules =
    document.getElementById("questRules").textContent;

  const time =
    document.getElementById("questTime").textContent;

  const bonus =
    document.getElementById("questBonus").textContent;

  const text =
`${title}

🎯 Objective:
${objective}

📜 Rules:
${rules}

⏱️ Time:
${time}

🔥 Bonus:
${bonus}`;

  navigator.clipboard.writeText(text);

  alert("Challenge copied! 🎮");

}

</script>

</body>
</html>
